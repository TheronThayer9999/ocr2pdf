<div
  class="flex flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm"
  [style.height]="height()"
>
  <header class="flex items-center gap-2 border-b border-slate-200 bg-slate-50 px-3 py-2">
    <span class="truncate text-sm font-medium text-slate-700" [title]="fileName()">
      {{ fileName() }}
    </span>

    <span class="ml-auto flex shrink-0 items-center gap-2">
      <button
        type="button"
        class="rounded-md border border-slate-300 bg-white px-2.5 py-1 text-xs font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="!url()"
        (click)="reload()"
      >
        Reload
      </button>

      <a
        class="rounded-md border border-slate-300 bg-white px-2.5 py-1 text-xs font-medium text-slate-700 transition hover:bg-slate-100"
        [class.pointer-events-none]="!url()"
        [class.opacity-40]="!url()"
        [href]="url()"
        [download]="fileName()"
      >
        Download
      </a>

      <button
        type="button"
        class="rounded-md border border-slate-300 bg-white px-2.5 py-1 text-xs font-medium text-slate-700 transition hover:bg-slate-100 disabled:cursor-not-allowed disabled:opacity-40"
        [disabled]="!url()"
        (click)="openInNewTab()"
      >
        Open
      </button>
    </span>
  </header>

  <div class="relative flex-1 bg-slate-100">
    @if (url(); as pdfUrl) {
      <iframe
        #frame
        class="h-full w-full border-0"
        [src]="pdfUrl"
        [title]="fileName()"
        (load)="onLoad()"
      ></iframe>

      @if (loading()) {
        <div class="absolute inset-0 grid place-items-center bg-slate-100/80 text-sm text-slate-500">
          Loading PDF…
        </div>
      }
    } @else {
      <div class="grid h-full place-items-center p-8 text-center">
        <div>
          <p class="text-sm font-medium text-slate-600">No PDF loaded</p>
          <p class="mt-1 text-xs text-slate-400">
            Pass a URL, Blob or File through the <code class="font-mono">src</code> input.
          </p>
        </div>
      </div>
    }
  </div>
</div>
